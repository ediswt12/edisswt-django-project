<form action="{% url 'polls:vote' question.id %}" method="post">
    {% csrf_token %}
    {% for choice in question.choice_set.all %}
        <input type="radio" name="choice" value="{{ choice.id }}">
        {{ choice.choice_text }}<br>
    {% endfor %}
    <button type="submit">Səs ver</button>
</form>
